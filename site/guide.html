<style>
:root{--black:#0C0F14;--navy:#2B4A6B;--g1:#161B23;--g2:#1E242E;--g3:#2A313D;--g4:#8A93A3;--gold:#F59E0B;--w:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--black);color:var(--w);font-family:Inter,system-ui,sans-serif;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:5;background:rgba(12,15,20,.92);backdrop-filter:blur(8px);padding:14px 16px 10px}
.top-in{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px;position:relative}
.back{width:38px;height:38px;border-radius:50%;background:var(--g2);flex:none;transition:.2s;display:inline-grid;place-items:center;padding:0;line-height:0}.back svg{width:18px;height:18px;display:block}
.back:hover{background:var(--g3)}.back[hidden]{visibility:hidden;display:inline-grid}
.bar{flex:1;height:4px;background:var(--g2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.mn-b{width:38px;height:38px;border-radius:50%;background:var(--g2);flex:none;display:inline-grid;place-items:center;padding:0;transition:.2s}.mn-b:hover{background:var(--g3)}.mn-b svg{width:18px;height:18px}
.mn-p{position:absolute;right:0;top:46px;min-width:210px;background:var(--g1);border:1px solid var(--g3);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;z-index:6}.mn-p[hidden]{display:none}
.mn-p a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;color:#E6E9EF;font-size:14.5px;text-decoration:none}.mn-p a:hover{background:var(--g2)}.mn-p a svg{width:17px;height:17px;flex:none}
.barw{flex:1;position:relative;min-width:0}.barw .bar{flex:none}.cnt{position:absolute;right:0;top:11px;font-size:11px;color:var(--g4);line-height:1;pointer-events:none}
main{max-width:760px;margin:auto;padding:18px 16px 90px}
.aide{position:fixed;left:0;right:0;bottom:0;z-index:4;text-align:center;padding:13px 16px calc(13px + env(safe-area-inset-bottom));background:var(--black);border-top:1px solid var(--g3)}
.aide a{font-size:13px;color:var(--g4);text-decoration:none;letter-spacing:.02em;transition:color .18s}
.aide a:hover{color:var(--w)}
.aide[hidden]{display:none}
.step{animation:in .35s ease both}
.step.out{animation:out .2s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-24px)}}
.back-dir .step{animation-name:inb}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
h1,h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.02;text-wrap:balance}
h2{font-size:clamp(34px,7vw,52px)}
.sub{color:#B7BECB;margin:10px 0 22px;line-height:1.5;font-size:15.5px;max-width:56ch}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--g1);border:1.5px solid var(--g3);border-radius:14px;padding:16px 18px;transition:.18s}
.opt:hover{border-color:var(--gold);transform:translateY(-1px)}
.opt b{font-weight:600;font-size:16.5px;display:block}.opt small{color:var(--g4);font-size:13.5px;display:block;margin-top:2px}
.opt .ar{margin-left:auto;color:var(--g4)}
.opt .tg{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#111;border-radius:20px;padding:3px 9px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;text-align:left;background:var(--g1);border:1.5px solid var(--g3);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.card:hover{border-color:#4a5568}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--g2)}
.card img[src^="tente-etoile-situation"]{object-position:center 78%}.card img[src^="photobooth-lifestyle"]{object-position:center 45%}.card img[src^="brasero-situation"]{object-position:center 60%}
.card .t{padding:11px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font-size:14.5px;font-weight:600;line-height:1.25}
.card p{font-size:12.8px;color:#AEB6C4;line-height:1.4;flex:1}
.card p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
@media(max-width:480px){.card p{-webkit-line-clamp:3;font-size:12.5px}.star{font-size:9px;letter-spacing:.04em;padding:2px 7px;top:7px;left:7px;max-width:calc(100% - 52px);overflow:hidden;white-space:nowrap}.card .t{padding:10px 10px 11px}.vs{font-size:12px;padding:7px 5px}}
.card .pr{font-size:13px;color:var(--gold);font-weight:600;margin-top:4px}
.card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(12,15,20,.75);border:1.5px solid #fff6;display:grid;place-items:center;font-size:14px}
.card.on .chk{background:var(--gold);border-color:var(--gold);color:#111}
.star{position:absolute;top:8px;left:8px;background:var(--gold);color:#111;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--black) 30%);padding:26px 16px 16px}
.foot-in{max-width:760px;margin:auto;display:flex;gap:10px;align-items:center}
.btn{background:var(--w);color:#0C0F14;border-radius:999px;padding:13px 26px;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:.18s;display:inline-block}
.btn:hover{background:var(--gold)}
.btn.ghost{background:transparent;color:#B7BECB;border:1.5px solid var(--g3)}
.btn.ghost:hover{color:#fff;border-color:#fff}
.foot .btn:not(.ghost){flex:1}
.hero{position:relative;border-radius:18px;overflow:hidden;height:300px;background:var(--g1)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;opacity:0;transition:opacity .5s;pointer-events:none;background-size:cover;background-position:center}
.sl.on{opacity:1;pointer-events:auto}
.sl::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,15,20,.1),rgba(12,15,20,.88))}
.sl>*{position:relative}
.sl h1{font-size:clamp(34px,8vw,50px);margin-bottom:8px}.sl p{color:#D3D8E2;margin-bottom:14px;font-size:14.5px;max-width:42ch}
.sl .btn{align-self:flex-start;padding:11px 22px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--g3);cursor:pointer}.dots i.on{background:var(--gold);width:22px;border-radius:8px}
.note{font-size:12px;color:var(--g4);text-align:center;margin-top:10px}
.welcome{padding-top:30px}
.welcome h1{font-size:clamp(46px,11vw,76px);margin-bottom:14px}
.res-item{display:flex;gap:12px;align-items:center;background:var(--g1);border:1.5px solid var(--g3);border-radius:14px;padding:10px;margin-bottom:10px}
.res-item.off{opacity:.38}
.res-item img{width:86px;height:68px;object-fit:cover;border-radius:9px;flex:none}
.res-item .m{flex:1;min-width:0}.res-item b{font-size:14.5px;display:block}.res-item small{color:#AEB6C4;font-size:12.5px;display:block;line-height:1.35;margin-top:2px}
.res-item .p{font-weight:700;white-space:nowrap;font-size:14.5px}
.res-item .x{width:30px;height:30px;border-radius:50%;background:var(--g2);flex:none;font-size:14px}
.sec{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;color:var(--g4);margin:22px 0 10px}
.rc{font-style:normal;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--gold);color:#111;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.vs{margin-top:6px;width:100%;background:var(--g2);color:#fff;border:1px solid var(--g3);border-radius:8px;padding:7px 8px;font:inherit;font-size:12.5px}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:30}.sh.on{display:flex}
.sheet{background:var(--g1);border:1px solid var(--g3);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px 20px 18px;animation:up .25s ease}
/* mise à jour de la fiche (+ / −) : pas de nouvelle animation d'ouverture */
.sheet.sheet-re{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.lock,.lock body{overflow:hidden;overscroll-behavior:none}.sheet{overscroll-behavior:contain;touch-action:pan-y}.chip b{white-space:nowrap}.grab{width:40px;height:4px;border-radius:4px;background:var(--g3);margin:-10px auto 14px}.btn:disabled{opacity:.35;cursor:not-allowed}.btn:disabled:hover{background:var(--w)}
.sheet h2{font-size:34px;margin-bottom:6px}.sheet p{color:#B7BECB;font-size:14px;line-height:1.5;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--g2);font-size:14.5px}
.srow small{color:var(--g4)}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px;border:1px solid #fff4;vertical-align:-1px}
.stp{display:flex;align-items:center;gap:12px}.stp button{width:32px;height:32px;border-radius:50%;background:var(--g2);border:1px solid var(--g3)}.stp button:disabled{opacity:.3}.stp b{min-width:20px;text-align:center}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.chip{background:var(--g2);border:1.5px solid var(--g3);border-radius:12px;padding:10px 4px;text-align:center}.chip.on{border-color:var(--gold)}.chip b{display:block;font-size:13px}.chip small{color:var(--gold);font-size:12.5px}
.ck{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--g2);font-size:14.5px}.ck small{color:var(--g4)}.ck input{width:18px;height:18px;accent-color:#F59E0B}
.fl{display:block;margin-bottom:10px}.fl small{color:var(--g4);display:block;margin-bottom:4px}.fl input{width:100%;background:var(--g2);border:1px solid var(--g3);border-radius:10px;padding:11px 12px;color:#fff;font:inherit;font-size:14.5px}
.sf{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:14px}.sf .pr{font-weight:700;font-size:18px}
.tot{background:var(--g1);border:1.5px solid var(--g3);border-radius:16px;padding:16px 18px;margin-top:18px}
.tot div{display:flex;justify-content:space-between;padding:4px 0;color:#B7BECB;font-size:14.5px}
.tot .big{color:#fff;font-size:20px;font-weight:700;border-top:1px solid var(--g3);margin-top:8px;padding-top:12px}
.tot .rem{color:var(--gold)}
.nudge{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.5);color:#FBD38D;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px;line-height:1.45}
.fine{font-size:12px;color:var(--g4);margin-top:12px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:20;padding:20px}.modal.on{display:grid}
.modal>div{background:var(--g1);border:1px solid var(--g3);border-radius:18px;padding:26px;max-width:420px}
.modal h2{font-size:34px;margin-bottom:10px}.modal p{color:#B7BECB;line-height:1.5;margin-bottom:18px;font-size:14.5px}

<script>
const IM=new Proxy({},{get:(_,k)=>String(k)+'.webp'});
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString('fr-FR')+' €';
const G=['moins de 30','30 à 80','80 à 150','plus de 150'];
const S={type:null,lieu:null,g:null,abri:null,picks:{},off:{},vars:{},fam:null,cfg:{},set:{}};
let hist=[],cur=null,back=false;

/* ---------- Catalogue : prix selon le nombre d'invités (g = 0..3) ---------- */
const P={
pack:{n:'Pack Vespra',hook:'Sono, jeux de lumière et machine à fumée : l\'ambiance de soirée prête à l\'emploi, sans rien brancher de compliqué.',star:1,def:g=>[0,1,3,4][g],vars:[{l:'20 personnes',p:50,img:'pack-vespra-60-v2'},{l:'40 à 60 personnes',p:70,img:'pack-vespra-60-v2'},{l:'80 à 100 personnes',p:80,img:'pack-vespra-100-v2'},{l:'120 à 150 personnes',p:100,img:'pack-vespra-150-v2'},{l:'180 à 250 personnes',p:130,img:'pack-vespra-200-v2'}]},
jeux:{n:'Jeux de lumières',hook:'Des faisceaux colorés qui font danser la salle.',def:g=>g<=1?0:1,vars:[{l:'Ibiza 4 spots',p:20,img:'ambiance-soiree'},{l:'Eurolite 9 spots',p:30,img:'ambiance-soiree'}]},
spot:{opt:1,n:'Spots LED sur batterie',img:'spot-led-batterie-ambiance',hook:'Sans fil, posés où vous voulez : ils éclairent les murs, les tables, les arbres. La salle devient un décor.',p:20},
boule:{n:'Boule à facettes',img:'boule-facettes-situation',hook:'Le classique qui fait toujours son effet : des milliers de reflets sur les murs et les robes.',p:35},
karaoke:{n:'Karaoké',img:'karaoke',hook:'Le moment où tout le monde chante faux, et où tout le monde s\'en souvient.',p:20},
sono:{n:'Sono',hook:'Un son net et puissant, dimensionné pour votre nombre d\'invités.',def:g=>[0,1,3,4][g],vars:[{l:'20 personnes',p:20,img:'sono-30-40'},{l:'40 à 60 personnes',p:40,img:'sono-60-80'},{l:'80 à 100 personnes',p:50,img:'sono-80-100'},{l:'120 à 150 personnes',p:70,img:'sono-120-180'},{l:'180 à 250 personnes',p:100,img:'sono-180-250'}]},
micro:{n:'Micro sans fil',img:'micro-shure-sm58',hook:'Discours, remerciements, animation : tout le monde vous entend, où que vous soyez.',p:20},
projo:{n:'Vidéoprojecteur + écran',img:'videoprojecteur',hook:'Diaporama, présentation, film de famille ou match : une vraie image, grande et nette.',p:30},
etin:{n:'Étincelles froides',hook:'Une pluie d\'étincelles qui ne brûle pas, pour l\'entrée des mariés ou l\'ouverture de bal. Les invités sortent leur téléphone.',star:1,def:g=>g<=1?0:1,vars:[{l:'1 machine',p:85,img:'etincelles-froides-situation'},{l:'2 machines',p:130,img:'etincelles-froides-situation'}]},
nuage:{n:'Fumée lourde nuage',img:'fumee-lourde-nuage',hook:'Une machine à fumée lourde dépose un film nuageux au sol : vous dansez à travers les nuages.',p:150,star:1},
bruine:{n:'Fumée lourde brouillard',img:'fumee-lourde-wgf-2000-situation',hook:'Un brouillard bas et léger sur la piste, parfait pour une ambiance cinéma.',p:60},
feux:{opt:1,n:'Feux d\'artifice de jour',img:'canon-poudre-arc-en-ciel',hook:'Des canons à poudre colorée : un nuage de couleurs en plein jour, pour l\'annonce, la sortie de l\'église ou un gender reveal.',p:179,dès:1,v:'4 à 12 canons',star:1},
bulles:{n:'Machine à bulles',img:'machine-bulles',hook:'Des centaines de bulles pour les enfants (et les grands). Des photos magnifiques à la clé.',p:10},
photo:{opt:1,n:'Photobooth',hook:'Le coin photo où tout le monde passe. Des souvenirs immédiats, des invités qui se prennent au jeu.',star:1,def:()=>0,vars:[{l:'Numérique',p:130,img:'photobooth-lifestyle'},{l:'200 photos imprimées',p:190,img:'photobooth-lifestyle'},{l:'300 photos imprimées',p:240,img:'photobooth-lifestyle'},{l:'400 photos imprimées',p:290,img:'photobooth-lifestyle'},{l:'Formule illimitée',p:420,img:'photobooth'}]},
livre:{n:'Livre d\'or audio',img:'telephone-vintage',hook:'Un téléphone vintage où chacun laisse un message vocal. Vous le réécouterez dans dix ans.',p:35},
panneau:{opt:1,n:'Panneau de bienvenue',img:'panneau-bienvenue',hook:'Vos prénoms et votre date derrière une paroi vitrée où l\'eau ruisselle. L\'entrée qui impressionne.',p:190,star:1},
neon:{n:'Néon lumineux',img:'neon-lumineux',hook:'Votre message en lettres lumineuses : le décor photo de la soirée.',p:20},
cabine:{n:'Cabine téléphonique',img:'cabine-telephonique',hook:'Cabine avec livre d\'or, écran tactile : le souvenir qui animera vos mariages et vos fêtes, avec caméra et micro, en vidéo.',p:149},
mange:{n:'Mange-debout',img:'mange-debout',hook:'Housse blanche, plateau de 90 cm : les invités circulent, discutent, trinquent.',def:g=>g,unit:13,vars:[{l:'2 tables',p:26,n:2},{l:'4 tables',p:52,n:4},{l:'6 tables',p:78,n:6},{l:'10 tables',p:130,n:10}]},
brasero:{n:'Brasero',img:'brasero-situation',hook:'Un feu pour se réchauffer et se retrouver autour, quand la nuit tombe.',p:100},
popcorn:{n:'Machine à popcorn',img:'popcorn-situation',hook:'L\'odeur de fête foraine, les enfants ravis, les grands aussi.',p:20},
guir:{n:'Guirlande lumineuse',img:'guirlande-lumineuse',hook:'Grosses ampoules chaudes : l\'ambiance guinguette en un geste.',def:g=>[0,1,1,2][g],vars:[{l:'10 mètres',p:9},{l:'20 mètres',p:18},{l:'40 mètres',p:36}]},

res(){

 if(S.abri&&!ids.includes(S.abri))ids.unshift(S.abri);

 const nud=S.type==='mariage'&&on.length===4?`<div class="nudge">Plus qu'un produit et la remise mariage de 10 % s'applique automatiquement (soit environ ${eur(Math.round(sum*.1))} sur votre sélection).</div>`:'';

 ${rest.length?'<div class="sec">Matériel</div>'+rest.map(row).join(''):''}

 ${nud}
 <div class="tot"><div><span>${on.length} produit${on.length>1?'s':''}, par week-end</span><span>${eur(sum)}</span></div>${rem?`<div class="rem"><span>Remise mariage −10 %</span><span>−${eur(rem)}</span></div>`:''}<div class="big"><span>Estimation</span><span>${eur(sum-rem)}</span></div></div>

};

function selection(){
 const ids=Object.keys(S.picks).filter(k=>S.picks[k]);
 if(S.abri&&!ids.includes(S.abri))ids.unshift(S.abri);
 return ids.filter(id=>!S.off[id]);
}
function devis(){
 const sel=selection();if(!sel.length){return}
 let cart=[];try{cart=JSON.parse(localStorage.getItem('vespra_cart')||'[]')}catch(e){}
 sel.forEach(id=>{const x=it(id),l=CAT[id](x);
  const item=Object.assign({qty:1,price:x.price,label:''},l);if(!item.label)delete item.label;
  if(l.qty)item.price=l.price;else item.qty=1;
  const k=cart.findIndex(c=>c.id===item.id&&c.label===item.label&&!/_\d{10,}$/.test(item.id));
  if(k>-1)cart[k].qty=(cart[k].qty||1)+(item.qty||1);else cart.push(item)});
 try{localStorage.setItem('vespra_cart',JSON.stringify(cart));localStorage.setItem('vespra_guide',JSON.stringify({type:{mariage:'Mariage',anniv:'Anniversaire',pro:'Événement d\'entreprise',asso:'Fête de village / Comité des fêtes',autre:'Autre'}[S.type],convives:['Moins de 30 personnes','30 à 80 personnes','80 à 150 personnes','150 à 300 personnes'][S.g],lieu:{int:'à l\'intérieur (salle)',ext:'en extérieur',mix:'intérieur et extérieur',nsp:'pas encore décidé'}[S.lieu]}))}catch(e){}
 location.href='reservation.html';
}
