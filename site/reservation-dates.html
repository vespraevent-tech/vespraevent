<style>
@font-face{font-family:'Bebas Neue';src:url(/polices/bebas-neue-400-latin.woff2) format('woff2');font-display:swap}
:root{--navy:#2B4A6B;--navy-h:#1e3650;--black:#0C0F14;--g1:#3D4452;--g2:#646D7C;--g3:#C8CDD8;--g4:#F0F2F5;--gold:#F59E0B;--ok:#15803D;--r:14px;--rl:22px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--black);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid rgba(12,15,20,.08)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.02em;color:var(--navy);text-decoration:none}
.top small{font-size:12px;color:var(--g2)}
.wrap{max-width:1180px;margin:0 auto;padding:34px clamp(16px,4vw,32px) 80px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:34px}
.st{border-top:3px solid var(--g3);padding-top:10px;font-size:13px;font-weight:600;color:var(--g2);display:flex;gap:8px;align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:default}
.st em{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--g4);color:var(--g2)}
.st.on{border-color:var(--gold);color:var(--black)}.st.on em{background:var(--gold);color:#fff}
.st.ok{border-color:var(--navy);color:var(--black);cursor:pointer}.st.ok em{background:var(--navy);color:#fff}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin:0 0 10px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(36px,5vw,56px);line-height:.95;margin:0 0 10px}
h1 em{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--gold);text-transform:none}
.sub{color:var(--g2);font-size:15px;line-height:1.6;margin:0 0 28px;max-width:620px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.grid>*{min-width:0}
.card{background:#fff;border:1px solid rgba(12,15,20,.08);border-radius:var(--rl);padding:24px;box-shadow:0 10px 34px rgba(12,15,20,.05)}
/* calendrier */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h b{font-size:15px;text-transform:capitalize}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid rgba(12,15,20,.12);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav:disabled{opacity:.3;cursor:default}.nav svg{width:16px;height:16px}
.mois{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.m-t{text-align:center;font-weight:700;font-size:14px;text-transform:capitalize;margin-bottom:10px}
.jours{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.jours span{font-size:11px;color:var(--g2);text-align:center;padding:6px 0;font-weight:600}
.j{all:unset;box-sizing:border-box;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;position:relative;z-index:0}
.j:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;border-radius:10px}
.j.vide{cursor:default}
.j.passe{color:#b9bfca;cursor:not-allowed;text-decoration:line-through}
.j.entre::before{content:"";position:absolute;inset:2px 0;background:rgba(43,74,107,.09);z-index:-1}
.j.deb::before,.j.fin::before{content:"";position:absolute;inset:2px 0;background:rgba(43,74,107,.09);z-index:-1}
.j.deb::before{left:50%}.j.fin::before{right:50%}.j.deb.fin::before{display:none}
.j.deb::after,.j.fin::after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:var(--navy);z-index:-1}
.j.deb,.j.fin{color:#fff;font-weight:700}
.j:not(.passe):not(.vide):not(.deb):not(.fin):hover::after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;border:1px solid var(--navy);z-index:-1}
.j.auj{font-weight:700;color:var(--navy)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}
.dt{border:1px solid rgba(12,15,20,.12);border-radius:var(--r);padding:12px 14px;background:#fff;text-align:left;cursor:pointer}

.items{margin:8px 0 0;padding:0;list-style:none}

.tot span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g2)}
.tot b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:38px;color:var(--navy)}
.vide-r{font-size:13px;color:var(--g2);padding:14px 0}
/* mini catalogue */
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.ch{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(12,15,20,.12);background:#fff;font-size:12.5px;font-weight:600;color:var(--g1);cursor:pointer}
.ch.on{background:var(--black);border-color:var(--black);color:#fff}
.cherche{width:100%;height:44px;border:1px solid rgba(12,15,20,.12);border-radius:999px;padding:0 18px;font:inherit;font-size:14px;margin-bottom:14px}

.pc-c{font-size:11px;color:var(--g2)}

.pc-bas{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.pc-bas .pc-p{margin:0}
.fen{position:fixed;inset:0;z-index:50;background:rgba(12,15,20,.42);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
.fen.on{opacity:1}
.fen-b{position:relative;width:100%;max-width:460px;max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 24px 70px rgba(12,15,20,.25);transform:translateY(10px);transition:transform .25s}
.fen.on .fen-b{transform:none}
.fen-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border:0;border-radius:50%;background:var(--g4);color:var(--g1);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fen-x svg{width:14px;height:14px}
.fen-h{display:flex;gap:14px;align-items:center;margin:0 34px 18px 0}

.fen-n{font-size:15px;font-weight:800;text-transform:uppercase;color:var(--navy);line-height:1.25}
.fen-t{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g2);margin:16px 0 8px}

.fen-o{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(12,15,20,.12);border-radius:12px;font-size:13.5px;cursor:pointer}
.fen-o:has(input:checked){border-color:var(--navy);background:rgba(43,74,107,.04)}
.fen-o input{accent-color:var(--navy);margin:0}.fen-o span{flex:1}.fen-o b{font-weight:600;white-space:nowrap;font-size:13px}
.fen-i{width:100%;font:inherit;font-size:14px;border:1px solid rgba(12,15,20,.14);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.fen-ok{width:100%;margin-top:18px}
.fen-i.err{border-color:#b91c1c}
.fen-pas{display:flex;gap:6px;margin:-4px 0 14px}.fen-pas i{flex:1;height:3px;border-radius:3px;background:var(--g4)}.fen-pas i.on{background:var(--navy)}
.fen-t small{font-weight:500;letter-spacing:0;text-transform:none;color:#9aa1ad;margin-left:4px}
.dd{position:relative}
.dd-b{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(12,15,20,.14);border-radius:14px;background:#fff;cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s}
.dd-b:hover,.dd.ouvert .dd-b{border-color:var(--navy)}.dd.ouvert .dd-b{box-shadow:0 0 0 3px rgba(43,74,107,.08)}
.dd-b svg{width:16px;height:16px;flex:none;color:var(--g2);transition:transform .2s}.dd.ouvert .dd-b svg{transform:rotate(180deg)}
.dd-v{flex:1;display:flex;justify-content:space-between;gap:10px;font-size:14px}.dd-v b{font-weight:600}
.dd-l{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid rgba(12,15,20,.1);border-radius:14px;box-shadow:0 18px 40px rgba(12,15,20,.14);max-height:260px;overflow:auto}
.dd-l li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;outline:none}
.dd-l li:hover,.dd-l li:focus{background:var(--g4)}.dd-l li[aria-selected=true]{color:var(--navy);font-weight:600}
.dd-l li b{font-weight:600;white-space:nowrap}
.fen-act{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.fen-p[data-page="1"]{min-height:150px;display:flex;flex-direction:column}.fen-p[data-page="1"] .fen-ok{margin-top:auto}
.fen-p[hidden]{display:none!important}
.fen .dd-l{position:static;margin-top:6px;box-shadow:0 10px 26px rgba(12,15,20,.08);max-height:none}

.pc-add-old{margin-top:8px;height:36px;border-radius:999px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.pc-add{flex:none;height:28px;padding:0 11px;border-radius:999px;border:1px solid rgba(12,15,20,.14);background:#fff;color:var(--navy);font-size:11.5px;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s}
.pc-add:hover{border-color:var(--navy)}
.pc-add.ok{background:rgba(21,128,61,.08);border-color:rgba(21,128,61,.35);color:var(--ok)}
.vars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.var{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid rgba(12,15,20,.12);border-radius:10px;background:#fff;font-size:12px;cursor:pointer;text-align:left}
.var:hover{border-color:var(--navy)}.var b{white-space:nowrap}
/* coordonnées */
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g2)}
.f .l2{grid-column:1/-1}
.f input,.f textarea{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--black);border:1px solid rgba(12,15,20,.14);border-radius:12px;padding:12px 14px}

.merci{text-align:center;padding:40px 10px}
.merci svg{width:54px;height:54px;color:var(--ok)}
[hidden]{display:none!important}
.grp{display:flex;flex-direction:column;gap:8px}.grp-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g2)}.grp-t small{font-weight:500;letter-spacing:0;text-transform:none;color:#9aa1ad}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(12,15,20,.14);background:#fff;font-size:13px;font-weight:500;color:var(--g1);cursor:pointer;transition:border-color .2s,background .2s}
.puce:hover{border-color:var(--navy)}.puce.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ok-c{flex-direction:row!important;align-items:flex-start;gap:10px!important;font-size:12.5px!important;font-weight:400!important;letter-spacing:0!important;text-transform:none!important;color:var(--g1)!important;line-height:1.5}
.ok-c input{margin-top:2px;accent-color:var(--navy);width:16px;height:16px;flex:none}.ok-c a{color:var(--navy)}
.rl.rem span,.rl.rem b{color:var(--ok)}

.barre-m{display:none}
@media(max-width:960px){
  .barre-m{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(12,15,20,.08)}
  .barre-m small{display:block;font-size:11px;color:var(--g2)}.barre-m b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:26px;color:var(--navy);line-height:1}

}
@media(max-width:560px){h1{font-size:34px}.sub{font-size:13.5px;margin-bottom:18px}.top{padding:12px 16px}.logo{font-size:22px}.top small{display:none}.steps{margin-bottom:22px}.cherche{height:40px;font-size:13.5px}.ch{height:30px;font-size:11.5px}}
@media(max-width:960px){.grid{grid-template-columns:1fr}.rec{position:static}.mois{grid-template-columns:1fr}.mois .m2{display:none}}
@media(max-width:560px){.prods{grid-template-columns:1fr 1fr;gap:8px}.pc{border-radius:14px}.pc img{aspect-ratio:4/3}.pc-b{padding:8px 10px 10px;gap:3px}.pc-c{font-size:10px}.pc-n{font-size:11px}.pc-p{font-size:11px}.pc-bas{flex-direction:column;align-items:stretch;gap:6px}.pc-add{height:26px;font-size:11px}.modes,.f,.dates{grid-template-columns:1fr}.card{padding:18px}.st{font-size:11.5px}.st span{display:none}.st.on span{display:inline}}
</style>

<main class="wrap">
  <nav class="steps" id="steps" aria-label="Étapes"></nav>

  <div class="grid">
    <section id="zone"></section>
    <aside class="card rec" id="rec" aria-live="polite"></aside>
  </div>

  </div>

<script>
(function(){
  var S={etape:1,deb:null,fin:null,choix:'deb',mode:'',panier:[],cat:'Tout',q:'',mois:null,ouvert:null};
  var PRODUITS=[];
  var JOURS=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
  var auj=new Date();auj.setHours(0,0,0,0);
  S.mois=new Date(auj.getFullYear(),auj.getMonth(),1);
  var $=function(s,r){return (r||document).querySelector(s)};
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var eur=function(n){return Number(n||0).toLocaleString('fr-FR')+' €'};
  var fmt=function(d,long){return d?d.toLocaleDateString('fr-FR',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'}):''};
  var memeJour=function(a,b){return a&&b&&a.getTime()===b.getTime()};
  var nbJours=function(){return S.deb&&S.fin?Math.round((S.fin-S.deb)/864e5)+1:0};
  var ico={
    gauche:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
    droite:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>',
    depot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/></svg>',
    camion:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6"/></svg>'
  };

  /* ── étapes ── */
  function etapes(){
    var L=[['Vos dates','Dates et retrait'],['Votre matériel','Matériel'],['Vos coordonnées','Coordonnées']];
    $('#steps').innerHTML=L.map(function(x,i){var n=i+1,c=n===S.etape?'on':(n<S.etape?'ok':'');
      return '<button type="button" class="st '+c+'" data-e="'+n+'"'+(c==='ok'?'':' tabindex="-1"')+'><em>'+(c==='ok'?'✓':n)+'</em><span>'+x[0]+'</span></button>'}).join('');
  }
  $('#steps').addEventListener('click',function(e){var b=e.target.closest('.st.ok');if(b)aller(+b.dataset.e)});
  function aller(n){S.etape=n;rendre();window.scrollTo({top:0,behavior:'smooth'})}

  /* ── étape 1 : dates + mode ── */
  function moisHTML(m,cls){
    var an=m.getFullYear(),mo=m.getMonth(),premier=(new Date(an,mo,1).getDay()+6)%7,n=new Date(an,mo+1,0).getDate(),h='';
    for(var i=0;i<premier;i++)h+='<span class="j vide"></span>';
    for(var d=1;d<=n;d++){
      var j=new Date(an,mo,d),c=['j'];
      if(j<auj)c.push('passe');
      if(memeJour(j,auj))c.push('auj');
      if(memeJour(j,S.deb))c.push('deb');
      if(memeJour(j,S.fin))c.push('fin');
      if(S.deb&&S.fin&&j>S.deb&&j<S.fin)c.push('entre');
      h+='<button type="button" class="'+c.join(' ')+'" data-t="'+j.getTime()+'"'+(j<auj?' disabled':'')+' aria-label="'+fmt(j,1)+'">'+d+'</button>';
    }
    return '<div class="'+cls+'"><div class="m-t">'+m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</div><div class="jours">'+JOURS.map(function(x){return '<span>'+x+'</span>'}).join('')+h+'</div></div>';
  }
  function etape1(){
    var m2=new Date(S.mois.getFullYear(),S.mois.getMonth()+1,1),premierMois=S.mois<=new Date(auj.getFullYear(),auj.getMonth(),1);
    return '<p class="kick">Étape 1 sur 3</p><h1>VOS <em>dates</em></h1><p class="sub">Choisissez le jour où vous récupérez le matériel et le jour où vous le rendez. Vous pourrez ensuite composer votre sélection.</p>'+
    '<div class="card">'+
      '<div class="dates"><button type="button" class="dt'+(S.choix==='deb'?' on':'')+'" data-c="deb"><small>Début de location</small><b class="'+(S.deb?'':'ph')+'">'+(S.deb?fmt(S.deb,1):'Choisir une date')+'</b></button>'+
      '<button type="button" class="dt'+(S.choix==='fin'?' on':'')+'" data-c="fin"><small>Fin de location</small><b class="'+(S.fin?'':'ph')+'">'+(S.fin?fmt(S.fin,1):'Choisir une date')+'</b></button></div>'+
      '<div class="cal-h"><button type="button" class="nav" data-m="-1" aria-label="Mois précédent"'+(premierMois?' disabled':'')+'>'+ico.gauche+'</button><b></b><button type="button" class="nav" data-m="1" aria-label="Mois suivant">'+ico.droite+'</button></div>'+
      '<div class="mois">'+moisHTML(S.mois,'m1')+moisHTML(m2,'m2')+'</div>'+
      '<p class="aide">'+(S.deb&&S.fin?'Location de '+nbJours()+' jour'+(nbJours()>1?'s':'')+(weekend()?'.':' : en dehors d’un week-end, le tarif est établi sur devis.'):S.deb?'Choisissez maintenant la date de fin.':'Une date de début et une date de fin sont nécessaires.')+'</p>'+
      '<div class="sec-t">Retrait ou livraison</div>'+
      '<div class="modes">'+modesHTML()+'</div>'+
      '<div class="actions"><span></span><button type="button" class="btn" id="suiv1"'+(S.deb&&S.fin&&S.mode?'':' disabled')+'>Choisir mon matériel</button></div>'+
    '</div>';
  }
  function modesHTML(){
    var M={retrait:'<button type="button" class="mode'+(S.mode==='retrait'?' on':'')+'" data-mode="retrait">'+ico.depot+'<div><b>Retrait au dépôt de Vitré</b><span>Vous venez chercher le matériel, avec une prise en main sur place.</span></div></button>',
      livraison:'<button type="button" class="mode'+(S.mode==='livraison'?' on':'')+'" data-mode="livraison">'+ico.camion+'<div><b>Livraison et installation</b><span>Sur le lieu de votre événement, où qu’il se trouve. Tarif selon la distance.</span></div></button>'};
    /* l'option choisie passe à gauche, l'autre reste proposée à droite */
    return S.mode==='livraison'?M.livraison+M.retrait:M.retrait+M.livraison;
  }
  /* glissement des deux cartes quand elles échangent leur place */
  function choisirMode(m){
    var avant={};document.querySelectorAll('.mode').forEach(function(b){avant[b.dataset.mode]=b.getBoundingClientRect().left});
    S.mode=m;rendre();
    document.querySelectorAll('.mode').forEach(function(b){var dx=avant[b.dataset.mode]-b.getBoundingClientRect().left;if(!dx)return;
      b.style.transition='none';b.style.transform='translateX('+dx+'px)';void b.offsetWidth;b.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)';b.style.transform='';});
  }
  /* Tarif affiché : seulement pour une location de week-end (du vendredi au lundi au plus).
     Toute autre période (jeudi-lundi, en semaine, un mois…) est établie sur devis. */
  function weekend(){
    if(!S.deb||!S.fin)return true;
    var a=S.deb.getDay(),b=S.fin.getDay(),n=nbJours();
    return n<=4&&[5,6,0].indexOf(a)>=0&&[6,0,1].indexOf(b)>=0&&!(a===0&&b!==0&&b!==1);
  }
  function prixTxt(n){return weekend()?eur(n):'Sur devis'}
  function clicJour(t){
    var d=new Date(t);
    if(S.choix==='deb'||!S.deb||d<S.deb){S.deb=d;if(S.fin&&S.fin<d)S.fin=null;S.choix='fin';}
    else{S.fin=d;S.choix='deb';}
    rendre();
  }

  /* ── étape 2 : mini catalogue ── */
  function cats(){var c=['Tout'];PRODUITS.forEach(function(p){(p.cats||[p.cat]).forEach(function(x){if(x&&c.indexOf(x)<0)c.push(x)})});return c}
  function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
  function etape2(){
    var l=PRODUITS.filter(function(p){return (S.cat==='Tout'||(p.cats||[p.cat]).indexOf(S.cat)>=0)&&(!S.q||norm(p.name+' '+p.cat).indexOf(norm(S.q))>=0)});
    return '<p class="kick">Étape 2 sur 3</p><h1>VOTRE <em>matériel</em></h1><p class="sub">Du '+fmt(S.deb,1)+' au '+fmt(S.fin,1)+'. <span class="pc-sub-d">Ajoutez ce dont vous avez besoin : le total se met à jour à droite.</span></p>'+
    '<input class="cherche" id="q" type="search" placeholder="Rechercher un produit" value="'+esc(S.q)+'">'+
    '<div class="filtres">'+cats().map(function(c){return '<button type="button" class="ch'+(c===S.cat?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</div>'+
    (PRODUITS.length?'<div class="prods">'+l.map(carte).join('')+'</div>':'<p class="aide">Chargement du catalogue…</p>')+
    '<div class="actions"><button type="button" class="lien" data-go="1">← Modifier les dates</button><button type="button" class="btn" id="suiv2"'+(S.panier.length?'':' disabled')+'>Continuer</button></div>';
  }
  function carte(p){
    var n=S.panier.filter(function(x){return x.pid===p.id}).reduce(function(a,x){return a+x.qty},0);
    return '<div class="pc"><img src="/'+esc(p.img)+'" alt="" loading="lazy"><div class="pc-b"><div class="pc-c">'+esc(p.cat)+'</div><div class="pc-n">'+esc(p.name)+'</div>'+
      '<div class="pc-bas"><div class="pc-p">'+(p.devis||!weekend()?'Sur devis':((p.variants||[]).length>1?'Dès ':'')+eur(p.price))+'</div>'+
      '<button type="button" class="pc-add'+(n?' ok':'')+'" data-add="'+esc(p.id)+'" aria-label="Ajouter '+esc(p.name)+'">'+(n?'✓ '+n:'+ Ajouter')+'</button></div>'+
    '</div></div>';
  }
  function ajouter(id,v){
    var p=PRODUITS.find(function(x){return x.id===id});if(!p)return;
    /* produit à personnaliser (formule, options, texte) : petite fenêtre de choix */
    if(v==null&&((p.variants||[]).length>1||(p.options||[]).length||(p.perso||[]).length)){fenetre(p);return}
    var va=v!=null&&v>=0&&p.variants?p.variants[v]:null;
    var opts=(arguments[2]||[]),txt=(arguments[3]||'');
    var cle=id+(va?'_'+v:'')+(opts.length?'_'+opts.map(function(o){return o.id}).join('-'):'')+(txt?'_'+txt:'');
    var prix=(va?va.price:(p.devis?0:p.price))+opts.reduce(function(a,o){return a+(Number(o.price)||0)},0);
    var label=[va?va.label:''].concat(opts.map(function(o){return o.label})).concat(txt?['« '+txt+' »']:[]).filter(Boolean).join(' · ');
    var ex=S.panier.find(function(x){return x.cle===cle});
    if(ex)ex.qty++;else S.panier.push({cle:cle,pid:id,nom:p.name,label:label,price:prix,devis:!!p.devis,qty:1,img:p.img});
    rendre();
  }

  /* Fenêtre de personnalisation en deux temps : 1. la formule (liste déroulante), 2. les options. */
  function fenetre(p){
    var f=document.createElement('div');f.className='fen';f.setAttribute('role','dialog');f.setAttribute('aria-modal','true');f.setAttribute('aria-label',p.name);
    var vs=(p.variants||[]),os=(p.options||[]),ps=(p.perso||[]);
    var avecF=vs.length>1,avecO=os.length||ps.length,choix=Math.min(p.vdef||0,Math.max(0,vs.length-1)),page=avecF?1:2;
    var X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    f.innerHTML='<div class="fen-b"><button type="button" class="fen-x" aria-label="Fermer">'+X+'</button>'+
      '<div class="fen-h"><img src="/'+esc(p.img)+'" alt=""><div><div class="pc-c">'+esc(p.cat)+'</div><div class="fen-n">'+esc(p.name)+'</div></div></div>'+
      (avecF&&avecO?'<div class="fen-pas"><i class="on"></i><i></i></div>':'')+
      '<div class="fen-p" data-page="1">'+(avecF?
        '<div class="fen-t">'+esc(p.varTitre||'Formule')+'</div>'+
        '<div class="dd"><button type="button" class="dd-b" aria-haspopup="listbox" aria-expanded="false"><span class="dd-v"></span>'+CHEV+'</button>'+
        '<ul class="dd-l" role="listbox" hidden>'+vs.map(function(v,i){return '<li role="option" tabindex="-1" data-i="'+i+'"><span>'+esc(v.label)+'</span><b>'+prixTxt(v.price)+'</b></li>'}).join('')+'</ul></div>':'')+
        '<button type="button" class="btn fen-ok" data-a="'+(avecO?'suiv':'ok')+'">'+(avecO?'Suivant':'Ajouter au devis')+'</button></div>'+
      '<div class="fen-p" data-page="2">'+
        (os.length?'<div class="fen-t">'+esc(p.optTitre||'Options')+' <small>facultatif</small></div><div class="fen-l">'+os.map(function(o,i){return '<label class="fen-o"><input type="checkbox" value="'+i+'"><span>'+esc(o.label)+'</span><b>'+(o.price&&weekend()?'+ '+eur(o.price):'Sur devis')+'</b></label>'}).join('')+'</div>':'')+
        (ps.length?'<div class="fen-t">Personnalisation</div>'+ps.map(function(x){return '<input class="fen-i" data-p="'+esc(x.id)+'"'+(x.req?' data-req':'')+' maxlength="'+(x.max||60)+'" placeholder="'+esc(x.label)+(x.ph?' — '+esc(x.ph):'')+'">'}).join(''):'')+
        '<div class="fen-act">'+(avecF?'<button type="button" class="lien" data-a="prec">← Formule</button>':'<span></span>')+'<button type="button" class="btn" data-a="ok">Valider</button></div></div>'+
      '</div>';
    document.body.appendChild(f);requestAnimationFrame(function(){f.classList.add('on')});
    var dd=f.querySelector('.dd'),ddb=f.querySelector('.dd-b'),ddl=f.querySelector('.dd-l');
    function majDD(){if(!dd)return;f.querySelector('.dd-v').innerHTML='<span>'+esc(vs[choix].label)+'</span><b>'+prixTxt(vs[choix].price)+'</b>';
      ddl.querySelectorAll('li').forEach(function(li){li.setAttribute('aria-selected',String(+li.dataset.i===choix))})}
    function ouvrirDD(o){if(!dd)return;ddl.hidden=!o;ddb.setAttribute('aria-expanded',String(o));dd.classList.toggle('ouvert',o);if(o){var c=ddl.querySelector('[aria-selected=true]');if(c)c.focus()}}
    function montrer(n){page=n;f.querySelectorAll('.fen-p').forEach(function(x){x.hidden=+x.dataset.page!==n});
      f.querySelectorAll('.fen-pas i').forEach(function(x,i){x.classList.toggle('on',i<n)})}
    majDD();montrer(page);
    function fermer(){f.classList.remove('on');document.removeEventListener('keydown',clavier);setTimeout(function(){f.remove()},200)}
    function valider(){
      var manque=[].filter.call(f.querySelectorAll('.fen-i[data-req]'),function(i){return !i.value.trim()});
      if(manque.length){if(page!==2)montrer(2);manque[0].classList.add('err');manque[0].focus();return}
      var opts=[].map.call(f.querySelectorAll('.fen-l input:checked'),function(c){return os[+c.value]});
      var txt=[].map.call(f.querySelectorAll('.fen-i'),function(i){return i.value.trim()}).filter(Boolean).join(' / ');
      fermer();ajouter(p.id,vs.length?choix:-1,opts,txt);
    }
    function clavier(e){
      if(e.key==='Escape'){if(dd&&!ddl.hidden){ouvrirDD(false);ddb.focus()}else fermer();return}
      if(dd&&!ddl.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();var l=[].slice.call(ddl.children),i=l.indexOf(document.activeElement);i=Math.max(0,Math.min(l.length-1,i+(e.key==='ArrowDown'?1:-1)));l[i].focus()}
      if(dd&&!ddl.hidden&&e.key==='Enter'&&document.activeElement.dataset.i!=null){e.preventDefault();choix=+document.activeElement.dataset.i;majDD();ouvrirDD(false);ddb.focus()}
    }
    document.addEventListener('keydown',clavier);
    f.addEventListener('click',function(e){
      if(e.target===f||e.target.closest('.fen-x')){fermer();return}
      if(e.target.closest('.dd-b')){ouvrirDD(ddl.hidden);return}
      var li=e.target.closest('.dd-l li');if(li){choix=+li.dataset.i;majDD();ouvrirDD(false);return}
      if(dd&&!e.target.closest('.dd'))ouvrirDD(false);
      var a=e.target.closest('[data-a]');if(!a)return;
      if(a.dataset.a==='suiv')montrer(2);else if(a.dataset.a==='prec')montrer(1);else if(a.dataset.a==='ok')valider();
    });
  }

  /* ── étape 3 : coordonnées ── */
  var CONV=['Moins de 30 personnes','30 à 80 personnes','80 à 150 personnes','150 à 300 personnes','Plus de 300 personnes'];
  var TYP=['Mariage','Anniversaire','Fête de village / Comité des fêtes',"Événement d'entreprise",'Concert / Spectacle','Autre'];
  function puces(nom,l){return '<div class="puces" data-nom="'+nom+'">'+l.map(function(x){return '<button type="button" class="puce'+(S[nom]===x?' on':'')+'" data-puce="'+esc(x)+'">'+esc(x.replace(' personnes',''))+'</button>'}).join('')+'</div>'}
  function etape3(){
    var c=S.coord||{};var v=function(k){return esc(c[k]||'')};
    return '<p class="kick">Étape 3 sur 3</p><h1>VOS <em>coordonnées</em></h1><p class="sub">Nous vérifions la disponibilité et vous envoyons votre devis sous 24 h. Sans engagement.</p>'+
    '<form class="card" id="form" novalidate><div class="f">'+
      '<label>Prénom<input name="prenom" autocomplete="given-name" required value="'+v('prenom')+'"></label>'+
      '<label>Nom<input name="nom" autocomplete="family-name" required value="'+v('nom')+'"></label>'+
      '<label>E-mail<input name="email" type="email" autocomplete="email" required value="'+v('email')+'"></label>'+
      '<label>Téléphone<input name="tel" type="tel" autocomplete="tel" required value="'+v('tel')+'"></label>'+
      (S.mode==='livraison'?'<label class="l2">Adresse du lieu de l’événement<textarea name="adresse" rows="2" data-adresse-autocomplete autocomplete="street-address" required placeholder="N° et rue&#10;Code postal Ville" style="min-height:64px;resize:none">'+v('adresse')+'</textarea></label>':'')+
      '<div class="l2 grp"><span class="grp-t">Nombre d’invités</span>'+puces('convives',CONV)+'</div>'+
      '<div class="l2 grp"><span class="grp-t">Type d’événement <small>facultatif</small></span>'+puces('type',TYP)+'</div>'+
      '<label class="l2">Message (facultatif)<textarea name="message" placeholder="Lieu, horaires, contraintes d’accès, questions…">'+v('message')+'</textarea></label>'+
      '<label class="l2 ok-c"><input type="checkbox" name="cgv"> <span>J’accepte les <a href="/cgv" target="_blank" rel="noopener">conditions de location</a> et que mes informations servent à traiter ma demande (<a href="/politique-de-confidentialite" target="_blank" rel="noopener">confidentialité</a>).</span></label>'+
    '</div><p class="err" id="err"></p>'+
    '<div class="actions"><button type="button" class="lien" data-go="2">← Modifier le matériel</button><button type="submit" class="btn" id="envoyer">Envoyer ma demande</button></div></form>';
  }
  function merci(){
    return '<div class="card merci">'+ico.ok+'<h1 style="margin-top:14px">DEMANDE <em>envoyée</em></h1><p class="sub" style="margin:0 auto">Merci ! Nous vérifions la disponibilité du matériel à vos dates et nous vous répondons sous 24 h.</p><div class="actions" style="justify-content:center"><a class="btn" href="/">Retour à l’accueil</a></div></div>';
  }

  /* ── récapitulatif ── */
  function recap(){
    var tot=0,devis=false;
    var items=S.panier.map(function(x,i){tot+=x.price*x.qty;if(x.devis)devis=true;
      return '<li class="it"><span>'+esc(x.nom)+'</span><span class="px">'+(x.devis?'Sur devis':prixTxt(x.price*x.qty))+'</span>'+(x.label?'<small>'+esc(x.label)+'</small>':'')+
      '<span class="qte"><button type="button" data-q="'+i+'" data-d="-1" aria-label="Retirer un">−</button><span>'+x.qty+'</span><button type="button" data-q="'+i+'" data-d="1" aria-label="Ajouter un">+</button></span></li>'}).join('');
    $('#rec').innerHTML='<h3>VOTRE RÉSERVATION</h3>'+
      '<div class="rl"><span>Début</span><b>'+(S.deb?fmt(S.deb):'—')+'</b></div>'+
      '<div class="rl"><span>Fin</span><b>'+(S.fin?fmt(S.fin):'—')+'</b></div>'+

      ((function(){var pk=infoPack();return weekend()&&pk&&pk.actif?'<div class="rl rem"><span>Remise 10 %</span><b>− '+eur(pk.remise)+'</b></div>':''})())+
      (weekend()?'<div class="tot"><span>Total estimé</span><b>'+eur(tot-((infoPack()||{}).actif?infoPack().remise:0))+'</b></div>':'<div class="tot"><span>Total</span><b style="font-size:26px">Sur devis</b></div><p class="aide">Location hors week-end : le tarif dépend de la durée et du matériel, nous vous l’envoyons sous 24 h.</p>')+
      (devis||S.mode==='livraison'?'<p class="aide">'+(S.mode==='livraison'?'+ livraison selon la distance':'')+(devis?(S.mode==='livraison'?' · ':'')+'+ éléments sur devis':'')+'</p>':'');
  }
  $('#barreM').addEventListener('click',function(e){if(e.target.closest('[data-suiv]'))aller(3)});
  $('#rec').addEventListener('click',function(e){var b=e.target.closest('[data-q]');if(!b)return;var x=S.panier[+b.dataset.q];x.qty+=+b.dataset.d;if(x.qty<1)S.panier.splice(+b.dataset.q,1);rendre()});

  /* ── rendu ── */
  function rendre(){
    etapes();
    var z=$('#zone');
    z.innerHTML=S.etape===1?etape1():S.etape===2?etape2():S.etape===3?etape3():merci();
    recap();sauver();
    /* téléphone : total et bouton « Continuer » toujours visibles en bas de l'écran */
    var bm=$('#barreM');
    if(S.etape===2){var tot=S.panier.reduce(function(a,x){return a+x.price*x.qty},0),n=S.panier.reduce(function(a,x){return a+x.qty},0);
      bm.innerHTML='<div><small>'+n+' produit'+(n>1?'s':'')+'</small><b>'+(weekend()?eur(tot):'Sur devis')+'</b></div><button type="button" class="btn" data-suiv'+(n?'':' disabled')+'>Continuer</button>';bm.hidden=false;}
    else bm.hidden=true;
  }
  $('#zone').addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.dataset.t){clicJour(+t.dataset.t);return}
    if(t.dataset.c){S.choix=t.dataset.c;rendre();return}
    if(t.dataset.m){S.mois=new Date(S.mois.getFullYear(),S.mois.getMonth()+(+t.dataset.m),1);rendre();return}
    if(t.dataset.mode){choisirMode(t.dataset.mode);return}
    if(t.id==='suiv1'){aller(2);return}
    if(t.id==='suiv2'){aller(3);return}
    if(t.dataset.go){aller(+t.dataset.go);return}
    if(t.dataset.cat){S.cat=t.dataset.cat;rendre();return}
    if(t.dataset.add){ajouter(t.dataset.add,t.dataset.v!=null?+t.dataset.v:null);return}
  });
  $('#zone').addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;rendre();var q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}});
  /* Envoi : même formulaire Netlify « reservation » que la page Réservation, donc même arrivée dans le back-office. */
  function jj(d){return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()}
  function infoPack(){try{return window.VESPRA_PACK?VESPRA_PACK.info(S.panier.map(function(x){return {id:x.pid,price:x.price,qty:x.qty}})):null}catch(e){return null}}
  $('#zone').addEventListener('input',function(e){if(e.target.form&&e.target.form.id==='form'){S.coord=S.coord||{};S.coord[e.target.name]=e.target.value}});
  $('#zone').addEventListener('submit',function(e){
    e.preventDefault();var f=e.target,ok=true,g=function(n){return f.elements[n]?String(f.elements[n].value||'').trim():''};
    f.querySelectorAll('input[required]').forEach(function(i){if(!i.value.trim())ok=false});
    if(!ok||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('email'))){$('#err').textContent='Merci de compléter vos coordonnées (e-mail valide).';return}
    if(!S.convives){$('#err').textContent='Merci d’indiquer le nombre d’invités.';return}
    if(!f.elements.cgv.checked){$('#err').textContent='Merci d’accepter les conditions de location.';return}
    var we=weekend(),pk=infoPack(),n=nbJours();
    var lignes=S.panier.map(function(x){var l=String(x.label||'').split(' · ');return {produit:x.nom,formule:l[0]||'',options:l.slice(1).join(', '),quantite:x.qty,prix:x.devis||!we?'sur devis':(x.price*x.qty)+' €'}});
    var periode='Du '+fmt(S.deb,1)+' '+S.deb.getFullYear()+' au '+fmt(S.fin,1)+' '+S.fin.getFullYear()+' ('+n+' jour'+(n>1?'s':'')+')';
    var det=['PÉRIODE DE LOCATION : '+periode+(we?'':' — hors week-end : tarif sur devis'),
      'MODE : '+(S.mode==='livraison'?'Livraison et installation':'Retrait au dépôt de Vitré'),''].concat(S.panier.map(function(x){return '• '+x.nom+(x.label?' — '+x.label:'')+' × '+x.qty+' : '+(x.devis||!we?'sur devis':(x.price*x.qty)+' €')}));
    if(pk&&pk.actif&&we){det.push('');det.push('OFFRE ÉVÉNEMENT : '+pk.n+' produits — remise de 10 % ('+pk.remise+' €) à déduire du total des locations (livraison exclue)')}
    var d={'form-name':'reservation','bot-field':'','subject':'📅 Demande de disponibilité — Vespra Event','demande':'Disponibilités pour réserver',
      'client_type':S.type==="Événement d'entreprise"?'Entreprise ou association':'Particulier',
      prenom:g('prenom'),nom:g('nom'),email:g('email'),tel:g('tel'),date:jj(S.deb),convives:S.convives||'',type:S.type||'',
      livraison:S.mode==='livraison'?'oui':'non',adresse_livraison:g('adresse'),source:'Parcours de réservation en 3 étapes',
      message:periode+(g('message')?'\n\n'+g('message'):''),cartData:JSON.stringify(lignes,null,1),
      livraison_installation:S.mode==='livraison'?'Oui — livraison et installation demandées':'Non',
      details_devis:det.join('\n'),pack_mariage:(pk&&pk.actif&&we)?('Oui — '+pk.n+' produits — remise de 10 % ('+pk.remise+' €) à déduire'):'',
      conditions_acceptees:'Oui',donnees_acceptees:'Oui'};
    var b=$('#envoyer');b.disabled=true;b.textContent='Envoi en cours…';
    fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(d).toString()})
      .then(function(r){if(!r.ok)throw 0;S.panier=[];S.etape=4;rendre();try{localStorage.removeItem('vespra_cart');localStorage.removeItem('vespra_parcours')}catch(x){}window.scrollTo(0,0)})
      .catch(function(){b.disabled=false;b.textContent='Envoyer ma demande';$('#err').textContent='Envoi impossible pour le moment. Réessayez ou appelez le 06 50 83 68 28.'});
  });
  $('#zone').addEventListener('click',function(e){var p=e.target.closest('[data-puce]');if(!p)return;var nom=p.parentNode.dataset.nom;
    S[nom]=(S[nom]===p.dataset.puce&&nom==='type')?'':p.dataset.puce;
    p.parentNode.querySelectorAll('.puce').forEach(function(x){x.classList.toggle('on',x.dataset.puce===S[nom])});});

  /* Panier partagé avec le reste du site (« vespra_cart ») ; dates et mode gardés si la page est rechargée */
  function sauver(){
    if(S.etape===4)return;
    try{localStorage.setItem('vespra_cart',JSON.stringify(S.panier.map(function(x){return {id:x.pid+'_'+x.cle.replace(/[^a-z0-9]/gi,'').slice(-12),baseName:x.nom,name:x.nom+(x.label?' — '+x.label:''),label:x.label,price:x.price,qty:x.qty,devis:x.devis,img:x.img}})));
      localStorage.setItem('vespra_parcours',JSON.stringify({deb:S.deb&&S.deb.getTime(),fin:S.fin&&S.fin.getTime(),mode:S.mode}))}catch(x){}
  }
  (function reprendre(){
    try{var c=JSON.parse(localStorage.getItem('vespra_cart')||'[]');
      S.panier=c.filter(function(x){return x&&x.price!=null}).map(function(x,i){return {cle:'ext'+i+'_'+(x.id||''),pid:String(x.id||'').split('_')[0],nom:x.baseName||String(x.name||'Produit').split(' — ')[0],label:x.label||'',price:Number(x.price)||0,devis:!!x.devis,qty:x.qty||1,img:x.img||''}});
      var p=JSON.parse(localStorage.getItem('vespra_parcours')||'null');
      if(p){if(p.deb&&p.deb>=auj.getTime())S.deb=new Date(p.deb);if(p.fin&&S.deb&&p.fin>=S.deb.getTime())S.fin=new Date(p.fin);S.mode=p.mode||''}
    }catch(x){}
  })();

  rendre();
  fetch('/catalogue.html',{credentials:'omit'}).then(function(r){return r.text()}).then(function(t){
    var d=t.indexOf('const PRODUCTS=[');if(d<0)return;var fin=t.indexOf('\n];',d);
    try{PRODUITS=(new Function('return '+t.slice(d+'const PRODUCTS='.length,fin+2)))()}catch(x){PRODUITS=[]}
    if(S.etape===2)rendre();
  }).catch(function(){});
})();
</script>
</body>
</html>
